name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One run per branch. A force-push or a rapid series of commits should not
# leave three builds racing to report on a state that no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` fails on formatting drift as well as lint errors, and never
      # rewrites files — so a locally-unformatted commit is caught here rather
      # than silently fixed.
      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

  docker:
    name: Build image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — the image is not pushed anywhere. This job exists to prove
      # the Dockerfile still works after a change, which is the one thing local
      # tests cannot tell you.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
