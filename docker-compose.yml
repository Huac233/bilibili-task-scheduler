# Docker Compose for local testing and 1Panel deployment.
#
# 1Panel can consume this file directly through its 编排 (orchestration) feature;
# the only value that must be supplied is SESSION_SECRET.
#
#   docker compose up -d --build
#
# Note the single volume: SQLite keeps its database plus WAL sidecars inside
# /app/data, so mounting anything narrower would lose data on redeploy.

services:
  app:
    build: .
    image: bilibili-task-scheduler:latest
    container_name: bilibili-task-scheduler
    restart: unless-stopped

    ports:
      - '8787:8787'

    environment:
      # Signs session tokens. Changing it logs everyone out.
      # Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PORT: '8787'
      HOST: '0.0.0.0'
      DB_PATH: /app/data/app.sqlite

    volumes:
      - ./data:/app/data

    # The container healthcheck is defined in the Dockerfile; this is a
    # compose-level backstop for orchestration that ignores image healthchecks.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
